services:
  - type: web
    name: bejaa-pet-backend
    runtime: python
    pythonVersion: "3.11.9"
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: WA_INSTANCE
        sync: false
      - key: WA_TOKEN
        sync: false
      - key: API_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  - type: web
    name: bejaa-pet-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: BACKEND_URL
        sync: false
      - key: API_KEY
        fromService:
          type: web
          name: bejaa-pet-backend
          envVarKey: API_KEY
      - key: AUTH_SECRET
        generateValue: true
